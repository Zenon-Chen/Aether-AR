<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aether-AR · 全模态边缘终端</title>
  <style>
    :root {
      --bg: #080b12;
      --panel: rgba(16, 22, 36, 0.86);
      --border: rgba(88, 196, 255, 0.22);
      --cyan: #4de1ff;
      --green: #38ef7d;
      --amber: #ffb347;
      --text: #e6eef8;
      --muted: #8a9bb5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #132038 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: 0.5px; }
    .orb {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 12px var(--amber);
      transition: all 0.3s ease;
    }
    .orb.watch { background: var(--cyan); box-shadow: 0 0 14px var(--cyan); }
    .orb.duplex { background: var(--green); box-shadow: 0 0 18px var(--green); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
    .badge {
      font-size: 12px; padding: 4px 10px; border-radius: 999px;
      background: rgba(77, 225, 255, 0.12); border: 1px solid var(--border); color: var(--cyan);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 14px;
      flex: 1;
    }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    video {
      width: 100%; aspect-ratio: 4 / 3; object-fit: cover;
      border-radius: 10px; background: #04060a; border: 1px solid rgba(255,255,255,0.08);
    }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      padding: 9px 14px; border-radius: 9px; border: 1px solid var(--border);
      background: rgba(77, 225, 255, 0.12); color: var(--text);
      font-weight: 500; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: rgba(77, 225, 255, 0.24); }
    button.primary { background: linear-gradient(135deg, #0099cc, #00cc88); border: none; color: #fff; }
    .meter-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--green)); transition: width 0.08s; }
    .log-box {
      flex: 1; min-height: 260px; max-height: 460px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px; font-size: 14px; padding-right: 4px;
    }
    .msg { padding: 9px 12px; border-radius: 10px; line-height: 1.45; }
    .msg.user { background: rgba(77, 225, 255, 0.12); align-self: flex-end; border: 1px solid rgba(77,225,255,0.25); }
    .msg.assistant { background: rgba(56, 239, 125, 0.11); align-self: flex-start; border: 1px solid rgba(56,239,125,0.25); }
    .msg.sys { font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.04); font-family: monospace; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; padding: 9px 12px; border-radius: 9px;
      border: 1px solid var(--border); background: rgba(0,0,0,0.35); color: var(--text); outline: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div id="orb" class="orb"></div>
      <span>AETHER-AR</span>
    </div>
    <span id="stateBadge" class="badge">DISCONNECTED</span>
  </header>

  <div class="grid">
    <div class="card">
      <h3>房间多模态传感器 (WebRTC AEC + 像素差分门控)</h3>
      <video id="camPreview" autoplay playsinline muted></video>
      <div class="meter-bar"><div id="motionFill" class="meter-fill"></div></div>
      <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted);">
        <span id="motionText">画面差分 Δ = 0.000</span>
        <span id="fpsText">已上传关键帧: 0</span>
      </div>
      <div class="controls">
        <button id="btnStart" class="primary">启动房间感知终端</button>
        <button id="btnFlip">切换前后镜头</button>
        <button id="btnForcePulse">立即触发视觉脉搏</button>
      </div>
    </div>

    <div class="card">
      <h3>全双工交互流 & PiKernel / Hy-Memory 旁路动态</h3>
      <div id="logBox" class="log-box"></div>
      <div class="input-row">
        <input id="txtInput" type="text" placeholder="可直接说话，或在此输入消息测试..." />
        <button id="btnSend">发送</button>
      </div>
    </div>
  </div>

  <canvas id="capCanvas" width="640" height="480" style="display:none;"></canvas>
  <canvas id="diffCanvas" width="64" height="36" style="display:none;"></canvas>

  <script>
    let ws = null;
    let audioCtx = null;
    let mediaStream = null;
    let facingMode = "user";
    let prevTinyGray = null;
    let lastSentTs = 0;
    let uploadedFrames = 0;
    let activeSources = [];
    let nextPlayTime = 0;

    const orb = document.getElementById("orb");
    const stateBadge = document.getElementById("stateBadge");
    const logBox = document.getElementById("logBox");
    const videoEl = document.getElementById("camPreview");
    const capCanvas = document.getElementById("capCanvas");
    const diffCanvas = document.getElementById("diffCanvas");

    function appendLog(cls, text) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function flushSpeakerAudio() {
      for (const src of activeSources) {
        try { src.stop(0); } catch (_) {}
      }
      activeSources = [];
      if (audioCtx) nextPlayTime = audioCtx.currentTime;
    }

    function playDownlinkPcm24k(arrayBuffer) {
      if (!audioCtx) return;
      const pcmBytes = new Int16Array(arrayBuffer.slice(1));
      if (pcmBytes.length === 0) return;
      const float32 = new Float32Array(pcmBytes.length);
      for (let i = 0; i < pcmBytes.length; i++) float32[i] = pcmBytes[i] / 32768.0;

      const audioBuf = audioCtx.createBuffer(1, float32.length, 24000);
      audioBuf.getChannelData(0).set(float32);

      const src = audioCtx.createBufferSource();
      src.buffer = audioBuf;
      src.connect(audioCtx.destination);
      const startAt = Math.max(audioCtx.currentTime, nextPlayTime);
      src.start(startAt);
      nextPlayTime = startAt + audioBuf.duration;
      activeSources.push(src);
      src.onended = () => { activeSources = activeSources.filter(s => s !== src); };
    }

    function captureAndSendFrame(forceEval = false, isHd = false) {
      if (!ws || ws.readyState !== WebSocket.OPEN || !videoEl.videoWidth) return;
      const dCtx = diffCanvas.getContext("2d", { willReadFrequently: true });
      dCtx.drawImage(videoEl, 0, 0, 64, 36);
      const rgba = dCtx.getImageData(0, 0, 64, 36).data;
      const gray = new Uint8Array(64 * 36);
      let diffSum = 0;
      for (let i = 0, p = 0; i < rgba.length; i += 4, p++) {
        gray[p] = (rgba[i] * 77 + rgba[i+1] * 150 + rgba[i+2] * 29) >> 8;
        if (prevTinyGray) diffSum += Math.abs(gray[p] - prevTinyGray[p]);
      }
      const motionScore = prevTinyGray ? diffSum / (64 * 36 * 255) : 1.0;
      document.getElementById("motionFill").style.width = Math.min(100, motionScore * 600) + "%";
      document.getElementById("motionText").textContent = "画面差分 Δ = " + motionScore.toFixed(3);

      const now = performance.now() / 1000;
      if (forceEval || isHd || motionScore >= 0.025 || (now - lastSentTs) >= 30.0) {
        prevTinyGray = gray;
        lastSentTs = now;
        capCanvas.width = isHd ? videoEl.videoWidth : 640;
        capCanvas.height = isHd ? videoEl.videoHeight : 480;
        capCanvas.getContext("2d").drawImage(videoEl, 0, 0, capCanvas.width, capCanvas.height);
        const dataUrl = capCanvas.toDataURL("image/jpeg", isHd ? 0.88 : 0.72);
        ws.send(JSON.stringify({
          type: "video_frame",
          jpeg_b64: dataUrl.split(",")[1],
          motion_score: Number(motionScore.toFixed(4)),
          is_hd: isHd,
          force_eval: forceEval
        }));
        uploadedFrames++;
        document.getElementById("fpsText").textContent = "已上传关键帧: " + uploadedFrames;
      }
    }

    async function startTerminal() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws/edge`);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => appendLog("sys", "已连接至中枢网关 /ws/edge");
      ws.onclose = () => { stateBadge.textContent = "DISCONNECTED"; orb.className = "orb"; };
      ws.onmessage = (ev) => {
        if (ev.data instanceof ArrayBuffer) {
          const tag = new Uint8Array(ev.data, 0, 1)[0];
          if (tag === 0x02) playDownlinkPcm24k(ev.data);
          return;
        }
        const msg = JSON.parse(ev.data);
        if (msg.type === "state_sync") {
          stateBadge.textContent = msg.state;
          orb.className = "orb " + (msg.state === "LIVE_DUPLEX" ? "duplex" : "watch");
        } else if (msg.type === "control") {
          if (msg.action === "clear_audio") {
            flushSpeakerAudio();
            appendLog("sys", "⚡ Semantic VAD 打断：已瞬时清空扬声器缓冲");
          } else if (msg.action === "capture_hd_frame") {
            captureAndSendFrame(false, true);
          }
        } else if (msg.type === "pulse_decision") {
          appendLog("sys", `[视觉脉搏: ${msg.action}] ${msg.scene_state}` + (msg.observation ? ` | 记忆: ${msg.observation}` : ""));
        } else if (msg.type === "kernel_event" && (msg.event === "tool_start" || msg.event === "agent_end")) {
          appendLog("sys", `[PiKernel ${msg.event}] ${JSON.stringify(msg.detail)}`);
        } else if (msg.type === "transcript" && msg.final) {
          appendLog(msg.role === "user" ? "user" : "assistant", msg.text);
        }
      };

      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      await initMedia();
      setInterval(() => captureAndSendFrame(false, false), 650);
      document.getElementById("btnStart").textContent = "感知运行中";
    }

    async function initMedia() {
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
        video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      videoEl.srcObject = mediaStream;

      const source = audioCtx.createMediaStreamSource(mediaStream);
      const proc = audioCtx.createScriptProcessor(1024, 1, 1);
      proc.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const f32 = e.inputBuffer.getChannelData(0);
        const buf = new ArrayBuffer(1 + f32.length * 2);
        const view = new DataView(buf);
        view.setUint8(0, 0x01);
        for (let i = 0; i < f32.length; i++) {
          const s = Math.max(-1, Math.min(1, f32[i]));
          view.setInt16(1 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        ws.send(buf);
      };
      source.connect(proc);
      proc.connect(audioCtx.destination);
    }

    document.getElementById("btnStart").onclick = startTerminal;
    document.getElementById("btnFlip").onclick = async () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      if (audioCtx) await initMedia();
    };
    document.getElementById("btnForcePulse").onclick = () => captureAndSendFrame(true, false);
    document.getElementById("btnSend").onclick = () => {
      const inp = document.getElementById("txtInput");
      if (inp.value.trim() && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "text_input", text: inp.value.trim() }));
        inp.value = "";
      }
    };
    document.getElementById("txtInput").onkeydown = (e) => { if (e.key === "Enter") document.getElementById("btnSend").click(); };
  </script>
</body>
</html>
